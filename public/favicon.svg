<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Assamese Heritage Circular Emblem -->
  <circle cx="32" cy="32" r="31" fill="#1E0C0E" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#B31B1B" stroke-width="1" stroke-dasharray="2 2"/>
  
  <!-- Traditional Assamese Jaapi -->
  <g id="jaapi" transform="translate(0, 2)">
    <!-- Jaapi Cone -->
    <path d="M32 10 L10 46 C10 46 20 52 32 52 C44 52 54 46 54 46 L32 10 Z" fill="#F5E5B4" stroke="#D4AF37" stroke-width="1.8" stroke-linejoin="round"/>
    
    <!-- Radiating Bamboo Ribs -->
    <line x1="32" y1="10" x2="18" y2="48" stroke="#8C6D23" stroke-width="0.8" stroke-dasharray="2 1"/>
    <line x1="32" y1="10" x2="26" y2="51" stroke="#8C6D23" stroke-width="0.8" stroke-dasharray="2 1"/>
    <line x1="32" y1="10" x2="32" y2="52" stroke="#8C6D23" stroke-width="1"/>
    <line x1="32" y1="10" x2="38" y2="51" stroke="#8C6D23" stroke-width="0.8" stroke-dasharray="2 1"/>
    <line x1="32" y1="10" x2="46" y2="48" stroke="#8C6D23" stroke-width="0.8" stroke-dasharray="2 1"/>
    
    <!-- Red Cloth Triangles (Phool Patches) -->
    <polygon points="32,22 25,34 39,34" fill="#B31B1B"/>
    <polygon points="18,39 12,47 24,47" fill="#B31B1B"/>
    <polygon points="46,39 40,47 52,47" fill="#B31B1B"/>
    <polygon points="32,37 25,49 39,49" fill="#B31B1B"/>

    <!-- Center Apex Finial (Tupi) -->
    <circle cx="32" cy="7.5" r="2.2" fill="#D4AF37"/>
    <polygon points="30.5,10 32,5 33.5,10" fill="#D4AF37"/>
  </g>
</svg>
