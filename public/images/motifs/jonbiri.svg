<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Jonbiri: Iconic Assamese Crescent Moon Pendant Motif -->
  <g stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Hanging Loop -->
    <circle cx="60" cy="20" r="5" stroke-width="2.5" />
    <circle cx="60" cy="20" r="2" fill="currentColor" />
    <!-- Crescent Moon Outer Arc and Inner Arc -->
    <path d="M26 44 C26 78 52 100 60 100 C68 100 94 78 94 44 C84 62 68 70 60 70 C52 70 36 62 26 44 Z" fill="currentColor" fill-opacity="0.18" stroke-width="2.5" />
    <!-- Inner Meenakari Floral Filigree -->
    <circle cx="60" cy="84" r="3" fill="currentColor" />
    <path d="M50 78 C54 74 66 74 70 78" stroke-width="1.5" />
    <circle cx="44" cy="72" r="2" fill="currentColor" />
    <circle cx="76" cy="72" r="2" fill="currentColor" />
    <circle cx="36" cy="58" r="2" fill="currentColor" />
    <circle cx="84" cy="58" r="2" fill="currentColor" />
    <!-- Seed Pearl / Bead Hangings along the lower rim -->
    <circle cx="32" cy="62" r="2" />
    <circle cx="40" cy="80" r="2" />
    <circle cx="50" cy="94" r="2" />
    <circle cx="60" cy="106" r="3" fill="currentColor" />
    <circle cx="70" cy="94" r="2" />
    <circle cx="80" cy="80" r="2" />
    <circle cx="88" cy="62" r="2" />
  </g>
</svg>
